name: Build launcher APK

# Builds the launcher on GitHub's servers and attaches the APK to the run, so it can be
# downloaded from a phone. Start it from the Actions tab: "Build launcher APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: APK size
        run: ls -l launcher/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
